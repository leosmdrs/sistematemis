# Publica a release a partir de uma execução do workflow "Instalador".
#
# Não compila nada: pega o instalador e o versao.json que aquela
# execução produziu, confere que o SHA-256 do instalador é o que o
# versao.json declara, e cria a release com a etiqueta apontando para o
# commit que gerou o instalador — não para o topo do main.
#
# Publicar é o gesto que faz TODAS as estações receberem o aviso de
# atualização (releases/latest/download/versao.json). Por isso é um
# workflow à parte, disparado por uma pessoa, e não o fim da compilação.

name: Publicar release

on:
  workflow_dispatch:
    inputs:
      execucao:
        description: "Número da execução do workflow Instalador (o do endereço: .../actions/runs/NÚMERO)"
        required: true
      assinatura:
        description: "Assinatura do manifesto, feita com a chave de publicação (build/assinatura.py assinar). Obrigatória quando o programa tem chave registrada."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler a execução de origem
        id: origem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dados=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.execucao }}")
          nome=$(jq -r .name <<<"$dados")
          conclusao=$(jq -r .conclusion <<<"$dados")
          sha=$(jq -r .head_sha <<<"$dados")
          [ "$nome" = "Instalador" ] || { echo "A execução ${{ inputs.execucao }} é de '$nome', não do Instalador."; exit 1; }
          [ "$conclusao" = "success" ] || { echo "A execução ${{ inputs.execucao }} terminou em '$conclusao'."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # O código do commit que gerou o instalador: é dele que saem as
      # chaves públicas contra as quais a assinatura é conferida.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.origem.outputs.sha }}
          path: fonte

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.execucao }}
          github-token: ${{ github.token }}
          path: artefato
          merge-multiple: true

      - name: Conferir e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.origem.outputs.sha }}
          ASSINATURA: ${{ inputs.assinatura }}
        run: |
          set -euo pipefail
          cd artefato
          ls -la
          versao=$(jq -r .versao versao.json)
          esperado=$(jq -r .sha256 versao.json)
          instalador="SistemaTemis-${versao}-setup.exe"
          obtido=$(sha256sum "$instalador" | cut -d' ' -f1)
          [ "$obtido" = "$esperado" ] || { echo "SHA-256 não confere: versao.json declara $esperado, o arquivo tem $obtido"; exit 1; }

          # A versão no código daquele commit tem de ser a do manifesto.
          declarada=$(gh api "repos/${{ github.repository }}/contents/temis/__init__.py?ref=$SHA" --jq .content \
                      | base64 -d | sed -n 's/^__version__ = "\(.*\)"/\1/p')
          [ "$declarada" = "$versao" ] || { echo "O commit $SHA declara $declarada, e o manifesto $versao."; exit 1; }

          # A chave privada não está aqui — fica com quem publica. O que
          # se faz aqui é conferir a assinatura que veio, antes de
          # publicar: versão sem assinatura válida seria recusada por
          # todas as estações, e é melhor saber disso agora.
          tamanho=$(stat -c %s "$instalador")
          [ "$(jq -r .tamanho versao.json)" = "$tamanho" ] || { echo "O manifesto declara tamanho diferente do instalador ($tamanho bytes)."; exit 1; }
          exige=1
          if [ -f ../fonte/build/assinatura.py ]; then
            set +e
            python3 ../fonte/build/assinatura.py exige
            exige=$?
            set -e
          fi
          # 0: há chave registrada; 1: não há. Outro código é falha da
          # própria conferência, e não se publica sem saber.
          if [ "$exige" = "0" ]; then
            [ -n "$ASSINATURA" ] || { echo "Este programa tem chave de publicação registrada: informe a assinatura do manifesto."; exit 1; }
            python3 ../fonte/build/assinatura.py conferir --versao "$versao" --sha256 "$esperado" --tamanho "$tamanho" --assinatura "$ASSINATURA"
            jq --arg a "$ASSINATURA" '.assinatura = $a' versao.json > versao.assinado.json
            mv versao.assinado.json versao.json
          elif [ "$exige" != "1" ]; then
            echo "Não foi possível verificar se o programa exige assinatura (código $exige)."; exit 1
          fi

          if gh release view "v$versao" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "A release v$versao já existe. Nada foi alterado."; exit 1
          fi

          jq -r .notas versao.json > notas.md
          # A relação de componentes acompanha a release, quando a
          # compilação a produziu.
          anexos=("$instalador" versao.json)
          [ -f componentes.txt ] && anexos+=(componentes.txt)
          gh release create "v$versao" "${anexos[@]}" \
            --repo "${{ github.repository }}" \
            --target "$SHA" \
            --title "Sistema Têmis $versao" \
            --notes-file notas.md \
            --latest

          {
            echo "## Release v$versao publicada"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Instalador | \`$instalador\` |"
            echo "| SHA-256 | \`$obtido\` |"
          } >> "$GITHUB_STEP_SUMMARY"
